name: Update reward estimations
on:
  schedule:
    - cron: "47 */2 * * *"   # every 2 hours, offset from news
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_rewards.py
      - name: Commit if changed
        run: |
          git config user.name "minerspal-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hashrate/api/v2/reward-estimation
          git diff --cached --quiet && exit 0
          git commit -m "rewards: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
