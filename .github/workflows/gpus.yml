name: Update GPU list
on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  gpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_gpus.py
      - name: Commit if changed
        run: |
          git config user.name "minerspal-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hashrate/api/v2/mining-equipment/gpus.json hashrate/api/v2/algo/supported-algos.json
          git diff --cached --quiet && exit 0
          git commit -m "gpus: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
